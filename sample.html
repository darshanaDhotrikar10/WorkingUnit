        <div>
          <h3 class="font-semibold text-gray-700 mb-2">Select version</h3>
          <div class="space-y-2">
            <label class="flex items-center space-x-2">
              <input type="radio" name="version" class="form-radio">
              <span>Upload latest changes</span>
            </label>
            <label class="flex items-center space-x-2">
              <input type="radio" name="version" class="form-radio">
              <span>Upload selected versions</span>
            </label>
          </div>
        </div>

        <div>
          <h3 class="font-semibold text-gray-700 mb-2">Select a review</h3>
          <div class="space-y-2">
            <label class="flex items-center space-x-2">
              <input type="radio" name="review" class="form-radio">
              <span>Upload to last review</span>
            </label>
            <label class="flex items-center space-x-2">
              <input type="radio" name="review" class="form-radio">
              <span>Create new review</span>
            </label>
          </div>
        </div>

        <div class="pt-4">
          <span class="font-semibold text-gray-700">Collaborator user:</span>
        </div>
      </div>

      <div id="reviews" class="tab-content hidden text-gray-600">
        <p>This is the Document reviews tab content.</p>
        <p>Add review history or related info here...</p>
      </div>

      <div id="preferences" class="tab-content hidden text-gray-600">
        <p>This is the Preferences tab content.</p>
        <p>Settings, toggles, etc.</p>
      </div>
    </div>
	
	 <!-- Footer -->
	<div class="flex justify-between items-center p-4 border-t shrink-0">
    <h4 class="text-xl font-semibold text-gray-800">Collaborator user:</h4><span id='currentUsername'>somedata</span><
    <button onclick="AP.dialog.close();" class="text-blue-600 hover:underline">Close</button>
</div>


   
   

  <script>
  document.addEventListener("DOMContentLoaded", () => {
  showTab("preferences");  // works even without event now
});

    function showTab(tabId, event = null) {
  // Hide all tab contents
  document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));

  // Show selected content
  document.getElementById(tabId)?.classList.remove('hidden');

  // Remove active class from all tabs
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('tab-active'));

  // Add active class
  if (event) {
    event.target.classList.add('tab-active');
  } else {
   
    const tabButton2 = document.querySelector(`.tab[data-tab="${tabId}"]`);
	const tabButton = [...document.querySelectorAll(`.tab[data-tab="${tabId}"]`)].find(
  btn => btn.textContent.trim().toLowerCase() === tabId.toLowerCase()
);
    if (tabButton) tabButton.classList.add('tab-active');
  }
}
